# Kontekst http. Kontener hireos-public wymaga sieci hosta; port tylko na loopback.
# Zewnętrzny reverse proxy kończy TLS i kieruje ruch do 127.0.0.1:20172.
limit_req_zone $binary_remote_addr zone=hireos_requests:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=hireos_login:1m rate=5r/m;
# Tylko dokładny Origin HTTPS jest tłumaczony na lokalny Origin backendu.
# Nie usuwamy obcego Origin (backend odrzuca go); Origin null również jest odrzucany.
map $http_origin $hireos_origin {
    default $http_origin;
    "https://niezla.bieda.it" "http://127.0.0.1:4317";
}
server {
    listen 127.0.0.1:20172 default_server;
    server_name _;
    return 444;
}
server {
    listen 127.0.0.1:20172;
    server_name niezla.bieda.it;
    server_tokens off;
    client_max_body_size 11m;
    limit_req zone=hireos_requests burst=20 nodelay;
    limit_req_status 429;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_set_header Host 127.0.0.1:4317;
    proxy_set_header Origin $hireos_origin;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    # Sesję i zakresy kluczy sprawdza Node, również dla /api/state.
    location = /api/login {
        limit_req zone=hireos_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:4317;
    }
    location / {
        proxy_pass http://127.0.0.1:4317;
    }
}
