server {
    listen 8080 default_server;
    server_name _;
    return 444;
}

server {
    listen 8080;
    server_name niezla.bieda.it;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 16k;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /hireos-api/health {
        default_type application/json;
        return 200 '{"service":"hireos-public-preview","mode":"static-demo","workerApi":"not-implemented","outreachEnabled":false}';
    }

    location /hireos-api/ {
        default_type application/json;
        return 503 '{"error":"worker_api_not_ready","outreachEnabled":false}';
    }

    location /api/ {
        default_type application/json;
        return 403 '{"error":"private_demo_api"}';
    }

    location = / { try_files /index.html =404; }
    location = /index.html { try_files $uri =404; }
    location = /app.js { try_files $uri =404; }
    location = /seed.js { try_files $uri =404; }
    location = /styles.css { try_files $uri =404; }
    location / { return 404; }
}
