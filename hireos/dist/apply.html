<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aplikuj — HireOS</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/apply.js" defer></script>
  </head>
  <body>
    <main class="application">
      <p>HireOS · rekrutacja</p>
      <h1 id="title">Aplikacja</h1>
      <article id="advertisement"></article>
      <form id="application-form">
        <label for="name">Imię i nazwisko</label>
        <input id="name" name="name" required maxlength="160" autocomplete="name" />
        <label for="email">Adres e-mail</label>
        <input id="email" name="email" type="email" required maxlength="254" autocomplete="email" />
        <label for="cv">CV w formacie PDF (maks. 10 MB)</label>
        <input id="cv" name="cv" type="file" accept="application/pdf,.pdf" required />
        <label
          ><input name="consent" type="checkbox" required /> Zgadzam się na przetwarzanie danych w
          celu przeprowadzenia rekrutacji. Klauzula v1.</label
        >
        <button type="submit">Wyślij aplikację</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
